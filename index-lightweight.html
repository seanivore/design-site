<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sean August Horvath | Creative Developer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #f5f5f5;
            color: #000;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        .content-layer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 1;
            max-width: 800px;
            padding: 2rem;
        }

        .content-layer h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .content-layer p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .wave-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .wave-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px) invert(1);
            -webkit-backdrop-filter: blur(10px) invert(1);
        }

        /* Create grid pattern with CSS */
        .wave-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, 
                    transparent, 
                    transparent 19px, 
                    rgba(0,0,0,0.1) 19px, 
                    rgba(0,0,0,0.1) 20px),
                repeating-linear-gradient(90deg, 
                    transparent, 
                    transparent 19px, 
                    rgba(0,0,0,0.1) 19px, 
                    rgba(0,0,0,0.1) 20px);
        }

        .wave-effect {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at var(--click-x, 50%) var(--click-y, 50%), 
                transparent 0%, 
                rgba(0, 100, 255, 0.3) 10%, 
                transparent 30%);
            opacity: 0;
            animation: ripple 1.5s ease-out;
            pointer-events: none;
        }

        @keyframes ripple {
            0% {
                opacity: 1;
                transform: scale(0);
            }
            100% {
                opacity: 0;
                transform: scale(3);
            }
        }

        .nav-btn {
            position: fixed;
            padding: 0.5rem 1.5rem;
            background: transparent;
            border: 2px solid #000;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 600;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            background: #000;
            color: #fff;
        }

        #projectsBtn { top: 2rem; left: 2rem; }
        #aboutBtn { top: 2rem; right: 8rem; background: #000; color: #fff; }
        #clearBtn { bottom: 2rem; right: 2rem; }

        .social-links a {
            color: #000;
            text-decoration: none;
            margin: 0 0.5rem;
        }

        /* Clear animation */
        .clearing {
            animation: clearWave 2s ease-out forwards;
        }

        @keyframes clearWave {
            0% {
                opacity: 1;
                transform: translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateY(-100vh);
            }
        }
    </style>
</head>
<body>
    <div class="content-layer">
        <h1>Sean August Horvath</h1>
        <p>Graphic Designer with 14 years experience in production, social media strategy, and user experience. I'm passionate about using design to make complexity accessible and engaging.</p>
        
        <div class="social-links">
            <a href="https://linkedin.com/in/seanivore" target="_blank">LinkedIn</a>
            <span>|</span>
            <a href="https://github.com/seanivore" target="_blank">GitHub</a>
            <span>|</span>
            <a href="mailto:sean@august.style">Email</a>
        </div>
    </div>

    <div class="wave-grid">
        <div class="wave-container" id="waveContainer">
            <div class="wave-pattern"></div>
        </div>
    </div>

    <button class="nav-btn" id="projectsBtn">PROJECTS</button>
    <button class="nav-btn" id="aboutBtn">ABOUT</button>
    <button class="nav-btn" id="clearBtn">CLEAR</button>

    <script>
        const waveContainer = document.getElementById('waveContainer');
        
        // Click ripple effect
        waveContainer.addEventListener('click', (e) => {
            const rect = waveContainer.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            
            const ripple = document.createElement('div');
            ripple.className = 'wave-effect';
            ripple.style.setProperty('--click-x', `${x}%`);
            ripple.style.setProperty('--click-y', `${y}%`);
            
            waveContainer.appendChild(ripple);
            
            ripple.addEventListener('animationend', () => {
                ripple.remove();
            });
        });
        
        // Clear button
        document.getElementById('clearBtn').addEventListener('click', () => {
            waveContainer.classList.add('clearing');
        });
        
        // Projects button
        document.getElementById('projectsBtn').addEventListener('click', () => {
            waveContainer.classList.add('clearing');
            setTimeout(() => {
                window.location.href = '#projects';
            }, 2000);
        });
    </script>
</body>
</html>
