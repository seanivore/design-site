<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sean August Horvath - Digital Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/portfolio-nav.css">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #0a0a0a;
            color: white;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }

        .placeholder-content {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }

        .portfolio-heading {
            margin: 0;
            font-size: 3rem;
            text-align: center;
            opacity: 0.2;
        }

        .portfolio-subheading {
            margin: 1rem 0 0;
            font-size: 1.2rem;
            text-align: center;
            opacity: 0.2;
            max-width: 600px;
        }
    </style>
</head>

<body>
    <div class="placeholder-content">
        <h1 class="portfolio-heading">Portfolio Projects</h1>
        <p class="portfolio-subheading">Select a project from the navigation below to explore high-demand digital assets</p>
    </div>
    <script src="assets/js/portfolio-nav.js"></script>
</body>

</html>
